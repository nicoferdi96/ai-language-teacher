[project]
name = "voice-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136",
    "livekit-agents[gradium,openai,silero,turn-detector]~=1.8",
    "livekit-api>=1.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls OpenRouter (RUN_LIVE=1)"]
