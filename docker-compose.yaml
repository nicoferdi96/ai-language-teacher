# `docker compose up` builds every image from the current source and starts
# the whole stack; `pull_policy: build` rebuilds on each up so code changes
# are always picked up (unchanged layers come from the build cache).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Host port 5433 avoids clashing with a native postgres on 5432.
    # Containers still reach postgres on 5432 over the compose network.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    pull_policy: build
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LESSON_PLANNER_URL: http://lesson-planner:8000/get_next_lesson/
      VOICE_API_URL: http://voice-api:8100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  lesson-planner:
    build: ./lessons_planning_workflow
    pull_policy: build
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Reach postgres over the compose network, overriding the host-side
      # localhost:5433 defaults baked into db_config.py.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PLANNER_MODEL: ${PLANNER_MODEL:-openai/gpt-5.4-nano}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # LiveKit worker: joins a room when the voice API dispatches "language-tutor".
  voice-worker:
    build: ./voice_agent
    pull_policy: build
    environment: &voice-env
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GRADIUM_API_KEY: ${GRADIUM_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-openai/gpt-5.4-nano}
      PLANNER_BASE_URL: http://lesson-planner:8000
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
    depends_on:
      - lesson-planner

  # FastAPI: prepares the lesson and returns a room token that dispatches the tutor.
  voice-api:
    build: ./voice_agent
    pull_policy: build
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment: *voice-env
    ports:
      - "8100:8100"
    depends_on:
      - lesson-planner

volumes:
  pgdata:
